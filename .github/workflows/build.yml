name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: agenthub2026
          KEY_PASSWORD: agenthub2026
        run: |
          chmod +x gradlew || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List outputs
        if: always()
        run: find app/build -name "*.apk" 2>/dev/null || echo "no apk yet"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AgentHub-1.0.0
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: AgentHub v1.0.0
          body: |
            ## AgentHub 1.0.0
            Native Jetpack Compose AI Agent Hub.
            - OpenAI-compatible chat (local llama-server / Ollama / cloud)
            - Agent tools: file_write/read/list/delete, http_get/post, calculator
            - Model catalog + agents
            - Material 3 UI
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
